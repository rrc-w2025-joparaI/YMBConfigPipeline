#This YMB pipeline  automatically testes changes pushed to the main branch, checks the standard python environment
# Provides repetable test execution and visible test results. It is a good base for controlled deployment and software quality.

name: YMB Banking App CI Pipeline
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
 
      - name: Run pytest
        run: pytest test_main.py -v
